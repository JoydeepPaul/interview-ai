services:
  - type: web
    name: interview-ai-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://joydeep-interview-ai.netlify.app
      - key: ALLOWED_ORIGINS
        value: https://joydeep-interview-ai.netlify.app,http://localhost:5173
